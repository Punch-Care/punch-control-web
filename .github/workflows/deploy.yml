name: Deploy frontend

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # IP público (Elastic IP) da EC2 — não é segredo (o domínio punchcontrol.com.br
    # resolve para ele). A segurança do deploy é pela chave SSH (secret EC2_SSH_KEY).
    env:
      EC2_HOST: "100.56.136.248"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (vite)
        run: yarn build
        env:
          VITE_API_URL: /api

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/$EC2_HOST/22" 2>/dev/null; then
            echo "::error::EC2 ($EC2_HOST) não responde na porta 22 — verifique o Security Group."
            exit 1
          fi

      - name: Rsync dist to EC2
        run: |
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_ed25519" \
            dist/ deploy@"$EC2_HOST":/opt/punch-care/web/
